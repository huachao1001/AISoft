
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>压缩包浏览器 - demo.zip</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", system-ui, -apple-system, sans-serif;
        }
        body {
            background: #f3f4f6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        svg.icon {
            width: 18px;
            height: 18px;
            stroke: #444;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
        }
        /* 标题栏 */
        .title-bar {
            height: 40px;
            background: #e9e9eb;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 8px;
        }
        .win-btn {
            width: 36px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: #444;
        }
        .win-btn.close:hover {
            background: #e53935;
            color: white;
        }
        .win-btn:hover {
            background: #d8d8da;
        }
        /* 工具栏 */
        .tool-bar {
            height: 52px;
            background: #f7f8fa;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #ddd;
            gap: 10px;
        }
        .tool-group {
            display: flex;
            gap: 8px;
            padding-right: 10px;
            border-right: 1px solid #dcdcdc;
        }
        .tool-group:last-child {
            border-right: none;
        }
        .tool-btn {
            padding: 7px 12px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            border-radius: 7px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            transition: all 0.16s ease;
            color: #333;
        }
        .tool-btn:hover:not(:disabled) {
            background: #f0f4f9;
            border-color: #b9c8dd;
        }
        .tool-btn:disabled {
            color: #aaaaaa;
            cursor: not-allowed;
            background: #f8f8f8;
            border-color: #eee;
        }
        .tool-btn:disabled svg.icon {
            stroke: #aaa;
        }
        /* 面包屑导航 */
        .breadcrumb-bar {
            height: 48px;
            background: #fff;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #ddd;
            gap: 4px;
        }
        .breadcrumb-back {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-right: 6px;
        }
        .breadcrumb-back:hover {
            background: #f1f1f1;
        }
        .breadcrumb-item {
            color: #2563eb;
            cursor: pointer;
            padding: 4px 7px;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .breadcrumb-item:hover {
            background: #e8f0fe;
        }
        .breadcrumb-sep {
            display: inline-flex;
            align-items: center;
            color: #9ca3af;
            margin: 0 2px;
        }
        .breadcrumb-sep svg.icon {
            stroke: #9ca3af;
        }
        .breadcrumb-current {
            color: #111;
            background: #eff6ff;
            padding: 4px 7px;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            gap:4px;
        }
        .search-input {
            margin-left: auto;
            width: 270px;
            padding: 7px 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }
        .search-input:focus {
            border-color: #60a5fa;
        }
        /* 主体区域 */
        .main-wrap {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 230px;
            background: #fff;
            border-right: 1px solid #ddd;
            padding: 14px;
            overflow-y: auto;
        }
        .tree-node {
            padding: 6px 7px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            margin: 2px 0;
            display: flex;
            align-items: center;
            gap:6px;
        }
        .tree-node:hover {
            background: #f3f4f6;
        }
        .tree-node.active {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .tree-indent {
            padding-left: 22px;
        }
        .file-area {
            flex: 1;
            background: #fff;
            overflow: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 11px 16px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            font-weight: 500;
            color: #555;
            font-size:14px;
        }
        td {
            padding: 11px 16px;
            border-bottom: 1px solid #f3f4f6;
            font-size:14px;
        }
        .cell-name {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        tr:hover {
            background: #f7f8fa;
        }
        tr.selected {
            background: #dbeafe;
        }
        /* 底部状态栏 */
        .status-bar {
            height: 36px;
            background: #f7f8fa;
            border-top:1px solid #ddd;
            padding: 0 16px;
            display:flex;
            align-items:center;
            justify-content: space-between;
            font-size:13px;
            color:#666;
            gap:12px;
        }
        .status-left {
            display: flex;
            align-items: center;
            gap:8px;
            overflow: hidden;
            white-space: nowrap;
        }
        .status-left .tag {
            background: #cfe2ff;
            color: #084298;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status-left svg.icon {
            stroke: #084298;
        }
        .status-right {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <!-- 标题栏 -->
    <div class="title-bar">
        <div class="win-btn">−</div>
        <div class="win-btn">□</div>
        <div class="win-btn close">×</div>
    </div>

    <!-- 工具栏 -->
    <div class="tool-bar">
        <div class="tool-group">
            <button class="tool-btn" id="btnRefresh">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M23 4v6h-6"/>
                    <path d="M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
                刷新
            </button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" id="btnExtractSel" disabled>
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                提取选中
            </button>
            <button class="tool-btn" id="btnExtractAll">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="8 10 12 14 16 10"/>
                    <line x1="12" y1="14" x2="12" y2="2"/>
                </svg>
                全部解压
            </button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" id="btnAdd">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="12 5 12 19"/>
                    <polyline points="5 12 19 12"/>
                </svg>
                添加文件
            </button>
            <button class="tool-btn" id="btnDel" disabled>
                <svg class="icon" viewBox="0 0 24 24">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
                删除选中
            </button>
        </div>
    </div>

    <!-- 面包屑：更换为标准 home svg -->
    <div class="breadcrumb-bar">
        <div class="breadcrumb-back" id="breadcrumbBack">
            <svg class="icon" viewBox="0 0 24 24">
                <polyline points="19 12 5 12 10 7"/>
                <polyline points="5 12 10 17"/>
            </svg>
        </div>
        <span class="breadcrumb-item" onclick="goArchiveRoot()">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            demo.zip
        </span>
        <span class="breadcrumb-sep">
            <svg class="icon" viewBox="0 0 24 24">
                <polyline points="9 18 15 12 9 6"/>
            </svg>
        </span>
        <span class="breadcrumb-item" onclick="goPath('probe')">probe</span>
        <span class="breadcrumb-sep">
            <svg class="icon" viewBox="0 0 24 24">
                <polyline points="9 18 15 12 9 6"/>
            </svg>
        </span>
        <span class="breadcrumb-current">code</span>

        <input class="search-input" placeholder="在压缩包内搜索文件或文件夹">
    </div>

    <div class="main-wrap">
        <!-- 左侧目录树，同步替换 home 图标 -->
        <div class="sidebar">
            <div class="tree-node" onclick="goArchiveRoot()">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                demo.zip（根目录）
            </div>
            <div class="tree-node">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                probe
            </div>
            <div class="tree-node tree-indent active">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                code
            </div>
            <div class="tree-node tree-indent">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                assets
            </div>
            <div class="tree-node tree-indent">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                res
            </div>
        </div>
        <!-- 右侧列表 -->
        <div class="file-area">
            <table id="fileTable">
                <thead>
                    <tr>
                        <th>名称</th>
                        <th>类型</th>
                        <th>大小</th>
                        <th>修改时间</th>
                    </tr>
                </thead>
                <tbody>
                    <tr onclick="selectRow(this)">
                        <td>
                            <div class="cell-name">
                                <svg class="icon" viewBox="0 0 24 24">
                                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                                </svg>
                                子文件夹
                            </div>
                        </td>
                        <td>文件夹</td>
                        <td>—</td>
                        <td>2026-11-05 06:36</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 状态栏里也同步更新为 home -->
    <div class="status-bar">
        <div class="status-left">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>C:\Users\chaohua\Desktop\demo.zip</span>
            <span class="tag">ZIP</span>
            <span>1.2 MB</span>
        </div>
        <div class="status-right">
            压缩包内：总计 1 个文件夹，0 个文件
        </div>
    </div>

    <script>
        const btnExtractSel = document.getElementById('btnExtractSel');
        const btnDel = document.getElementById('btnDel');
        let hasSelected = false;

        function selectRow(rowEl) {
            document.querySelectorAll('#fileTable tbody tr').forEach(tr => tr.classList.remove('selected'));
            rowEl.classList.add('selected');
            hasSelected = true;
            btnExtractSel.disabled = false;
            btnDel.disabled = false;
        }

        function goArchiveRoot() {
            alert('回到压缩包根目录：demo.zip');
        }
        function goPath(name) {
            alert(`进入压缩包内路径：/${name}`);
        }

        document.getElementById('btnExtractAll').onclick = () => alert('弹出：选择全部解压到的本地目录');
        document.getElementById('btnExtractSel').onclick = () => alert('提取选中条目到本地');
        document.getElementById('btnAdd').onclick = () => alert('选择本地文件，追加进当前压缩包');
        document.getElementById('btnDel').onclick = () => alert('从压缩包内删除选中条目');
        document.getElementById('btnRefresh').onclick = () => alert('重新读取压缩包目录');
        document.getElementById('breadcrumbBack').onclick = () => alert('返回上一级包内目录');
    </script>
</body>
</html>
