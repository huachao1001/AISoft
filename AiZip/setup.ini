; 爱压安装包清单
;
; 这个文件就是安装界面的全部来源：标题、说明、按钮文字、要带哪些文件、
; 装完跑什么命令。安装器本身是通用的，换应用只换这份清单。
;
; 文件路径相对 --root（构建目录），由 aiinstaller_add_package 传进去。
; 构建脚本会把 [files] 里的每一项补上 offset/size，源文件阶段只写 path。

[app]
displayName=爱压
version=1.0.0
publisher=爱压
exeName=AiZip.exe
; 不含盘符：装到哪个盘由安装器的策略在运行期决定
installSubdir=AISoft\AIZip

[ui]
windowTitle=安装爱压
title=安装爱压
description=把爱压放到目标目录，并挂上资源管理器右键菜单。
; 相对 --root 的图片，会显示在标题左侧
logo=logo.png
installText=安装
cancelText=取消
browseText=浏览...
allUsersText=所有用户
currentUserText=仅当前用户
showScope=1

[config]
; 右键菜单与文件关联的实现都在这个 dll 里，按标准配置 ABI 导出。
; 安装器只负责调它，不关心里面写了什么。
module=aizip_config.dll

[run]
; 可选：装完要执行的命令，留空就不启动任何东西。
; 这里启动主程序，用户装完即可直接用。
afterInstall=AiZip.exe

[files]
file.0.path=AiZip.exe
file.1.path=aizip_config.dll
; 界面图标只随包携带，不装到用户目录
file.2.path=logo.png
file.2.install=0
