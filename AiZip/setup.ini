; 爱压安装包清单
;
; 这个文件就是安装界面的全部来源：标题、说明、按钮文字、要带哪些文件、
; 装完跑什么命令。安装器本身是通用的，换应用只换这份清单。
;
; 文件路径相对 --root（构建目录），由 aiinstaller_add_package 传进去。
; 构建脚本会把 [files] 里的每一项补上 offset/size，源文件阶段只写 path。

[app]
displayName=爱压
version=1.0.0
publisher=爱压
exeName=AiZip.exe
; 不含盘符：装到哪个盘由安装器的策略在运行期决定
installSubdir=AISoft\AIZip

[ui]
windowTitle=安装爱压
title=安装爱压
description=把爱压放到目标目录，并挂上资源管理器右键菜单。
; 相对 --root 的图片，会显示在标题左侧
logo=logo.png
installText=安装
cancelText=取消
browseText=浏览...
allUsersText=所有用户
currentUserText=仅当前用户
showScope=1

[config]
; 右键菜单与文件关联的实现都在这个 dll 里，按标准配置 ABI 导出。
; 安装器只负责调它，不关心里面写了什么。
module=aizip_config.dll

[commands]
; 安装后按顺序执行的命令，每条的 text 会实时显示在进度条下方。
; 与 [config] 的 dll 并存：dll 负责需要 COM 的复杂注册，命令负责
; 「一条命令行就能做完」的事。
;
; 路径与参数里可用两个占位符，由安装器按本次安装展开：
;   ${dir}  安装目录（清单写死不合适：装到哪个盘是运行期才知道的）
;   ${root} 注册表根键：所有用户 → HKLM，仅当前用户 → HKCU
; 一定要用 ${root} 而不是写 HKLM：选「仅当前用户」或静默安装时写 HKLM
; 是越权，而且卸载只会清 HKCU，留下的项没人收。
;
; 这里放一条真实存在的命令把流程跑通：把 ProgID 的「打开方式」描述写上。
; 用 /f 覆盖写，重复安装不会因为「值已存在」而失败。
cmd.0.path=reg.exe
cmd.0.args=add "${root}\Software\Classes\AIZip.Archive" /ve /d "爱压压缩包" /f
cmd.0.text=正在登记文件类型说明...
; 这条是「有则更好」的清理动作，失败不该让整个安装失败。
cmd.0.required=0

[run]
; 「立即打开」复选框勾上时要执行的命令；不勾就不会启动任何东西。
afterInstall=AiZip.exe

[files]
file.0.path=AiZip.exe
file.1.path=aizip_config.dll
; 界面图标只随包携带，不装到用户目录
file.2.path=logo.png
file.2.install=0
