<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="midGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7147"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="botGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- 三层包体，留出安全边距 -->
  <rect x="6" y="22" width="28" height="7" rx="3" fill="url(#botGrad)"/>
  <rect x="6" y="15" width="28" height="7" rx="3" fill="url(#midGrad)"/>
  <rect x="6" y="8" width="28" height="7" rx="3" fill="url(#topGrad)"/>

  <!-- Y 型拉链：全部内收，避开包体边缘 -->
  <path d="M20 27 L20 17" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M20 17 L15 11" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M20 17 L25 11" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- 下段闭合拉链齿 -->
  <g stroke="#b45309" stroke-width="1" stroke-linecap="round">
    <line x1="18.2" y1="19" x2="21.8" y2="19"/>
    <line x1="18.2" y1="21" x2="21.8" y2="21"/>
    <line x1="18.2" y1="23" x2="21.8" y2="23"/>
  </g>

  <!-- 左上分叉齿，垂直于左斜带 -->
  <g stroke="#b45309" stroke-width="1" stroke-linecap="round">
    <line x1="17.4" y1="15.0" x2="18.3" y2="13.8"/>
    <line x1="16.2" y1="13.4" x2="17.1" y2="12.2"/>
  </g>

  <!-- 右上分叉齿，垂直于右斜带 -->
  <g stroke="#b45309" stroke-width="1" stroke-linecap="round">
    <line x1="22.6" y1="15.0" x2="21.7" y2="13.8"/>
    <line x1="23.8" y1="13.4" x2="22.9" y2="12.2"/>
  </g>

  <!-- 拉链头 -->
  <rect x="17.2" y="14.6" width="5.6" height="4.8" rx="1.4" fill="#fb923c" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="20" cy="17" r="1.1" fill="#b45309"/>

  <!-- 顶面高光 -->
  <path d="M8 9 L32 9" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
</svg>